# OutOfSight configuration

shield:
  # Remove containers a player cannot see from outgoing chunk packets.
  # Off by default, so installing this changes nothing until you decide to.
  # Auditing works either way, and it modifies nothing.
  enabled: false

  # Apply the shield only to players holding outofsight.shielded.
  # Grant it to yourself, check that you can still find and open your own
  # containers, then turn this off to cover everyone. Testing on a live server
  # should not mean switching it on for all your players at once.
  test-mode: false

  # Containers farther than this from a player are left out of the chunk packet
  # and delivered once that player comes closer. Base finding scans at render
  # distance, so this is where it loses. Vanilla clients do not draw block
  # entities much past this range either, so an honest player loses nothing.
  hide-beyond-blocks: 48.0

  # How often to look for containers that events did not report. A container
  # appearing a second late costs nothing, so this can stay slow. Minimum 20.
  discover-interval-ticks: 40

  # How often to deliver containers a player has come close enough to see.
  # Walking into a room and waiting for the chests is noticeable, so keep this
  # low. Minimum 1.
  deliver-interval-ticks: 5

  # Chunk radius around a player covered by the safety-net sweep.
  # Widening it extends coverage and raises sweep cost quadratically.
  sweep-radius-chunks: 4

  # Block types to hide. A base is not only chests: a furnace, a hopper or a
  # beacon says "someone lives here" just as plainly.
  protected-blocks:
    - chest
    - trapped_chest
    - barrel
    - ender_chest
    - spawner
    # Covers every colour of shulker box, not only the undyed one.
    - shulker_box
    - furnace
    - blast_furnace
    - smoker
    - hopper
    - brewing_stand
    - beacon
    - enchanting_table

  # Fake buried chests planted per chunk. 0 disables them.
  # Hiding says "you will not find it", decoys say "what you found is a lie".
  # Sealed in stone, they are never visible to a legitimate player.
  decoys-per-chunk: 0

  # Decoys quietly revert to the real block once a player is this close.
  decoy-correction-radius-chunks: 3

  # Registry id of the chest block entity. -1 learns it from live packets.
  # Version specific; set it manually if automatic learning fails.
  decoy-block-entity-type: -1

  # How often a chunk carries decoys. Sparse decoys poison a cheat's data just
  # as well, and the real cost is re-serialising every packet you touch.
  decoy-chunk-interval: 4
