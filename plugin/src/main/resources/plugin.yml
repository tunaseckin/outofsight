name: OutOfSight
version: '${version}'
main: io.github.tunaseckin.outofsight.OutOfSightPlugin
api-version: '1.21'
depend: [packetevents]
description: Stops base finding - hides buried containers from chunk packets
author: tunaseckin
website: https://github.com/tunaseckin/outofsight
commands:
  outofsight:
    description: OutOfSight administration
    usage: /outofsight <shield|testme|bypass|advise|xray|hidechest|reachdebug|reachsim|stress|perf|perfreset>
    permission: outofsight.admin
    aliases: [oos]
permissions:
  outofsight.admin:
    default: op
  outofsight.shielded:
    description: While shield.test-mode is on, the shield applies only to holders
    default: false
  outofsight.alerts:
    description: Receives decoy honeypot alerts
    default: op
  outofsight.bypass:
    description: Sees every container and storage vehicle, whatever the shield says
    default: false
