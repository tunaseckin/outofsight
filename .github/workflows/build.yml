name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and run unit tests
        working-directory: plugin
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: outofsight
          path: plugin/build/libs/*.jar

  # Starts a real Paper server and checks, from a client's point of view, what
  # the shield sends and withholds. See harness/e2e.mjs.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: outofsight
          path: dist
      - name: Prepare test server
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/ci-setup.sh server "$(ls dist/*.jar | head -n1)"
      - name: Install harness
        working-directory: harness
        run: npm install --no-audit --no-fund
      - name: Run end-to-end checks
        run: node harness/e2e.mjs server
      - name: Keep server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server/logs/
          if-no-files-found: ignore
