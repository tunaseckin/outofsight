name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and run unit tests
        working-directory: plugin
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: outofsight
          path: plugin/build/libs/*.jar

  # Starts a real Paper server and checks, from a client's point of view, what
  # the shield sends and withholds. See harness/e2e.mjs.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: outofsight
          path: dist
      - name: Prepare test server
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash harness/ci-setup.sh server "$(ls dist/*.jar | head -n1)"
      - name: Install harness
        working-directory: harness
        run: npm install --no-audit --no-fund
      - name: Run end-to-end checks
        run: node harness/e2e.mjs server
      - name: Keep server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server/logs/
          if-no-files-found: ignore

  # A pushed tag such as v0.1.0-beta.1 publishes the tested jar as a GitHub
  # release, with that version's section of CHANGELOG.md as the notes.
  release:
    needs: e2e
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: outofsight
          path: dist
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v ",") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "OutOfSight ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
